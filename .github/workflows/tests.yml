name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          # Let the test matrix own cache saves to avoid concurrent-save collisions.
          save-cache: false

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run pylint
        run: uv run pylint --fail-under=9.0 streetsign_server/

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          # Let the test matrix own cache saves to avoid concurrent-save collisions.
          save-cache: false

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Export requirements and audit
        run: |
          uv export --no-dev --no-emit-project -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find streetsign_server/static -name '*.js' -not -path '*/lib/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          # Let the test matrix own cache saves to avoid concurrent-save collisions.
          save-cache: false

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Check CSS syntax
        run: uv run python scripts/check_css.py

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          # Let the test matrix own cache saves to avoid concurrent-save collisions.
          save-cache: false

      - name: Sync dependencies
        run: uv sync --locked --no-dev --group docs

      - name: Build docs strictly
        run: uv run make -C docs html SPHINXOPTS="-W --keep-going"
